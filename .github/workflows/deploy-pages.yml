name: Deploy Preon Lite to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static webapp
        run: npm run build

      - name: Finalize GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/app.html
          mv site/app.html site/index.html
          cp site/index.html site/404.html
          touch site/.nojekyll
          if grep -q 'src/main.tsx' site/index.html; then
            echo 'ERROR: unbuilt source entry found in site/index.html'
            exit 1
          fi
          test -d site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
