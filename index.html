<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17181b" />
    <title>Pre'on Lite</title>
    <style>
      html,body{height:100%;margin:0;background:#17181b;color:#f4f2ec;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      body{display:grid;place-items:center}.card{max-width:560px;padding:30px;border:1px solid #34373e;border-radius:18px;background:#202226}.muted{color:#b5b8bf}a{color:#9ed0ff}
    </style>
    <script>
      (function () {
        var here = new URL(window.location.href);
        if (!here.pathname.endsWith('/site/') && !here.pathname.endsWith('/site/index.html')) {
          var target = new URL('./site/', here);
          fetch(target, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
            if (r.ok) window.location.replace(target.href);
          }).catch(function () {});
        }
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Pre'on Lite</h1>
      <p>A webapp buildje még nem került ebbe a branch-be.</p>
      <p class="muted">GitHubon a mellékelt workflow automatikusan elkészíti a <code>site/</code> mappát és publikálja a Pages oldalt. Ha ezt az oldalt látod, nézd meg az <strong>Actions</strong> fület, hogy lefutott-e a „Deploy Preon Lite to GitHub Pages” workflow.</p>
    </div>
  </body>
</html>
